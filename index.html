<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DockApp – iOS &amp; macOS icon gallery</title>
  <meta name="description" content="A gallery and database of iOS and macOS app icons. Browse, search and get inspired.">
  <meta name="theme-color" content="#030303">
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Nastaví téma ještě před vykreslením, ať to neblikne.
    (function () {
      var t = null;
      try { t = localStorage.getItem('dockapp-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <nav class="nav" aria-label="Platform">
        <button class="btn" type="button" data-platform="ios">iOS</button>
        <button class="btn" type="button" data-platform="macos">macOS</button>
      </nav>
      <div class="header-right" id="headerRight">
        <div class="search" id="searchWrap">
          <input id="search" class="search-input" type="text" inputmode="search" placeholder="Search…" aria-label="Search icons" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" hidden></button>
        </div>
        <button class="theme-switch" id="themeSwitch" type="button" aria-label="Switch theme"></button>
      </div>
    </div>
  </header>

  <div class="mobile-filters" id="mobileFilters"></div>

  <main class="container">
    <div class="toolbar">
      <p class="count" id="count" aria-live="polite"></p>
      <div class="toolbar-right">
        <span class="sort-label">Sort by</span>
        <div class="dd dd--sort" id="sortDd"></div>
        <div class="dd dd--category" id="categoryDd"></div>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No icons found.</p>
    <div id="sentinel" aria-hidden="true"></div>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close"></button>
      <img class="modal-img" id="modalImg" alt="" width="240" height="240">
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="tag" id="modalTag"></div>
      <dl class="rows">
        <div class="row"><dt>Developer</dt><dd id="mDeveloper"></dd></div>
        <div class="row"><dt>Date</dt><dd id="mDate"></dd></div>
        <div class="row"><dt>Website</dt><dd id="mWebsite"></dd></div>
        <div class="row"><dt>App Store</dt><dd id="mStore"></dd></div>
      </dl>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="data/apps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
